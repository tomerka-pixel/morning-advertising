<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>morning · יוצר המודעות</title>
<link rel="stylesheet" href="https://static.greeninvoice.co.il/fonts/ploni.min.css">
<link rel="icon" href="assets/morning-mark.svg">
<style>
:root{
  /* הטוקנים נלקחו מגיליון הסגנון של המערכת עצמה (app.css) */
  --ink:#033841;          /* צבע הטקסט וגם רקע הסרגל הכהה */
  --teal:#1a7870;         /* teal-green של מערכת העיצוב */
  --primary:#0dac81;      /* הירוק של כפתורי הפעולה */
  --primary-hover:#0b946f;
  --primary-active:#0a8b68;
  --blue:#1d58e3;
  --bg:#f5f6fa;           /* רקע ה-body במערכת */
  --card:#fff;
  --surface:#eff1f6;      /* משטח בהיר, ריחוף ומילוי */
  --line:#d3dade;         /* גבול ברירת מחדל */
  --line-strong:#b2bec6;
  --muted:#607684;        /* טקסט משני */
  --placeholder:#91a1ac;
  --err:#f63865;
  --err-bg:#fff2f2;
  --warn:#ffaf00;
  --warn-bg:#fff8e6;
  --ok-bg:#e6fbf4;
  --deep:#07674e;
  --radius:16px;
  --input-radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:ploni,Ping,Arial,sans-serif;color:var(--ink);background:var(--bg);direction:rtl;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
a{color:inherit}

/* ===== שלד המערכת ===== */
.app{display:flex;height:100%;overflow:hidden}
.rail{width:76px;flex:0 0 76px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px 0 16px;gap:2px;order:1}
.rail .mark{width:34px;height:34px;margin-bottom:20px}
.rail-btn{position:relative;width:52px;height:48px;border:0;background:transparent;color:#fff;border-radius:12px;cursor:pointer;display:grid;place-items:center;opacity:.88}
.rail-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-btn:hover,.rail-btn.active{background:rgba(255,255,255,.12);opacity:1}
.rail-btn .dot{position:absolute;top:9px;left:11px;width:7px;height:7px;border-radius:50%;background:#13be90}
.rail-sep{width:40px;height:1px;background:rgba(255,255,255,.16);margin:8px 0}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.rail-avatar{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center}
.rail-avatar img{width:22px;height:22px}
.rail-collapse{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;cursor:pointer;display:grid;place-items:center}
.rail-collapse svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.surface{flex:1;min-width:0;display:flex;flex-direction:column;order:2;overflow:hidden}
.topbar{height:84px;flex:0 0 84px;background:#fff;display:flex;align-items:center;gap:20px;padding:0 40px;border-bottom:1px solid var(--surface)}
.fab{width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 18px rgba(13,172,129,.28)}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.top-icon{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.top-icon:hover{background:var(--surface)}
.top-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.top-spacer{flex:1}
.main{flex:1;overflow:auto;padding:34px 46px 80px}
.wrap{max-width:1240px;margin:0 auto}

/* ===== ברכה ===== */
.hello{display:flex;align-items:center;gap:22px;margin-bottom:26px}
.hello-disc{width:96px;height:96px;flex:0 0 96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 14px rgba(3,56,65,.07)}
.hello-disc img{width:60px}
.hello h1{font-size:27px;margin-bottom:6px}
.hello p{margin:0;color:var(--muted);font-size:17px}

/* ===== כפתורים ===== */
.btn{border-radius:100px;font-weight:500;padding:11px 26px;cursor:pointer;font-size:17px;border:1px solid transparent;background:transparent;transition:.15s}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{border-color:var(--ink);color:var(--ink)}
.btn-outline:hover{background:var(--surface)}
.btn-ghost{color:var(--primary);padding:7px 10px;font-size:15px}
.btn-ghost:hover{text-decoration:underline}
.btn-sm{padding:8px 18px;font-size:15px}

/* ===== לשוניות ===== */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{border:0;background:transparent;padding:12px 20px;cursor:pointer;font-size:17px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--primary)}
.tab .count{background:var(--ok-bg);color:var(--deep);border-radius:4px;font-weight:500;padding:1px 8px;font-size:12px;margin-inline-start:6px}

/* ===== מד שלבים ===== */
.stepper{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:20px}
.stepper button{border:0;background:transparent;cursor:pointer;display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:100px;color:var(--muted);font-size:14px}
.stepper button i{width:22px;height:22px;border-radius:50%;background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:12px;font-style:normal;font-weight:700}
.stepper button.done{color:var(--teal)}
.stepper button.done i{background:var(--primary);color:#fff}
.stepper button.now{background:var(--ok-bg);color:var(--teal);font-weight:600}
.stepper button.now i{background:var(--teal);color:#fff}
.stepper button:disabled{cursor:default;opacity:.7}
.stepper .arrow{color:#c4ced3;font-size:12px}

/* ===== לוח היצירה ===== */
.board{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.panel>h2{font-size:21px;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:15px;margin:0 0 18px}
.step-title{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.step-title h2{font-size:21px}
.step-title small{color:var(--muted);font-size:14px}

/* ===== קלפי בחירה ===== */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.opts.wide{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.opt{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px 14px;cursor:pointer;text-align:center;transition:.14s;display:flex;flex-direction:column;align-items:center;gap:8px}
.opt:hover{border-color:var(--primary);background:var(--surface);transform:translateY(-2px);box-shadow:0 8px 18px rgba(3,56,65,.07)}
.opt.on{border-color:var(--primary);background:var(--ok-bg);box-shadow:0 0 0 2px rgba(13,172,129,.22)}
.opt .ic{width:42px;height:42px;border-radius:12px;background:var(--surface);color:var(--teal);display:grid;place-items:center;flex:0 0 42px}
.opt.on .ic{background:var(--primary);color:#fff}
.opt .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opt b{font-size:15px;font-weight:600;line-height:1.3}
.opt small{color:var(--muted);font-size:12.5px;line-height:1.4}
.opt .swatch{width:100%;height:44px;border-radius:10px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:100px;padding:8px 16px;cursor:pointer;font-size:15px;transition:.14s}
.chip:hover{border-color:var(--primary);background:var(--surface)}
.chip.on{border-color:var(--primary);background:var(--ok-bg);color:var(--teal);font-weight:600}
.grouplabel{font-size:14px;color:var(--muted);font-weight:500;margin-top:20px}

.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:var(--input-radius);padding:11px 14px;font-size:16px;background:#fff;outline:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,172,129,.12)}
.field textarea{resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step-foot{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.step-foot .spacer{flex:1}

/* ===== נכסי מותג ===== */
.drop{border:2px dashed #c4ced3;border-radius:14px;padding:26px 18px;text-align:center;background:var(--bg);cursor:pointer;transition:.15s;display:block}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--ok-bg)}
.drop input{display:none}
.drop .ic{width:44px;height:44px;border-radius:50%;background:var(--ok-bg);color:var(--primary);display:grid;place-items:center;margin:0 auto 10px}
.drop .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.drop b{display:block;font-size:16px;margin-bottom:3px}
.drop small{color:var(--muted)}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin-top:16px}
.asset{position:relative;border:2px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;cursor:pointer;transition:.14s}
.asset:hover{border-color:var(--line-strong)}
.asset.on{border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,172,129,.16)}
.asset .thumb{aspect-ratio:1;display:grid;place-items:center;
  background:linear-gradient(45deg,#eff1f6 25%,transparent 25%),linear-gradient(-45deg,#eff1f6 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#eff1f6 75%),linear-gradient(-45deg,transparent 75%,#eff1f6 75%);
  background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0}
.asset .thumb img{width:100%;height:100%;object-fit:contain;padding:8px}
.asset .cap{padding:7px 9px;font-size:12px;border-top:1px solid var(--surface);display:flex;justify-content:space-between;align-items:center;gap:6px}
.asset .cap b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset .cap span{color:var(--muted);flex:0 0 auto}
.asset .tick{position:absolute;top:7px;inset-inline-start:7px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:none;place-items:center;font-size:13px}
.asset.on .tick{display:grid}
.asset .del{position:absolute;top:7px;inset-inline-end:7px;width:22px;height:22px;border-radius:50%;background:rgba(3,56,65,.62);color:#fff;border:0;cursor:pointer;display:none;place-items:center;font-size:15px;line-height:1}
.asset:hover .del{display:grid}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;padding:0 9px 9px}
.tagrow button{border:1px solid var(--line);background:#fff;border-radius:100px;padding:3px 10px;font-size:12px;cursor:pointer}
.tagrow button.on{border-color:var(--primary);background:var(--ok-bg);color:var(--teal);font-weight:600}
.empty-lib{color:var(--muted);text-align:center;padding:24px;border:1px dashed #c4ced3;border-radius:13px;margin-top:14px;line-height:1.7}

/* ===== סיכום ===== */
.sum{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
.sum button{border:1px solid var(--line);background:#fff;border-radius:100px;padding:7px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px}
.sum button:hover{border-color:var(--primary);background:var(--surface)}
.sum button em{font-style:normal;color:var(--muted);font-size:12.5px}

/* ===== תוצאה ===== */
.result-empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.8}
.result-empty svg{width:52px;height:52px;stroke:var(--line-strong);fill:none;stroke-width:1.4;margin-bottom:12px}
.stage{background:var(--surface);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;min-height:230px}
.stage img,.stage video{max-width:100%;max-height:440px;border-radius:10px;box-shadow:0 8px 26px rgba(3,56,65,.14);display:block}
.meta{font-size:13px;color:var(--deep);background:var(--ok-bg);border:1px solid var(--ok-bg);border-radius:10px;padding:9px 12px;margin-top:12px}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.result-actions a{text-decoration:none;display:inline-block}
.spinner{width:46px;height:46px;border:5px solid var(--surface);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:48px 20px;color:var(--muted)}
.loading b{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}
.clock{font-variant-numeric:tabular-nums;font-size:15px;margin-top:10px;color:var(--muted)}

/* ===== גלריה ===== */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.g-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.g-thumb{aspect-ratio:1;background:var(--surface);cursor:zoom-in;position:relative}
.g-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.g-badge{position:absolute;top:8px;inset-inline-start:8px;background:rgba(3,56,65,.78);color:#fff;border-radius:100px;padding:2px 9px;font-size:11px}
.g-body{padding:11px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.g-text{font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;flex:1;max-height:74px;overflow:hidden}
.g-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--placeholder);gap:6px}
.g-empty{color:var(--muted);padding:30px;text-align:center;background:#fff;border:1px dashed #c4ced3;border-radius:14px}

/* ===== כללי ===== */
.notice{border-radius:12px;padding:13px 16px;font-size:15px;margin-bottom:18px;line-height:1.6}
.notice.warn{background:var(--warn-bg);border:1px solid #ffe1a3;color:#8a5f00}
.notice.err{background:var(--err-bg);border:1px solid #ffd0da;color:var(--err)}
.notice.info{background:#eafaff;border:1px solid #cbe9f7;color:var(--ink)}
.live-badge{display:inline-flex;align-items:center;gap:7px;background:var(--ok-bg);color:var(--deep);border-radius:100px;padding:5px 13px;font-size:13px;font-weight:600}
.live-badge i{width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px rgba(13,172,129,.2)}
.lightbox{position:fixed;inset:0;background:rgba(3,26,26,.86);display:grid;place-items:center;z-index:99;cursor:zoom-out;padding:30px}
.lightbox img,.lightbox video{max-width:94%;max-height:94%;border-radius:10px}
.chat-fab{position:fixed;bottom:26px;left:26px;width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 22px rgba(3,56,65,.28);z-index:80}
.chat-fab svg{width:24px;height:26px;fill:currentColor}
.chat-fab:hover{background:rgba(255,255,255,.12)}
.toast{position:fixed;bottom:24px;left:96px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:120;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stepbody{animation:fadeUp .22s ease}

@media(max-width:1080px){.board{grid-template-columns:1fr}}
@media(max-width:640px){
  .main{padding:22px 16px 70px}.rail{width:58px;flex-basis:58px}.topbar{padding:0 16px;height:72px;flex-basis:72px;gap:10px}
  .two{grid-template-columns:1fr}.hello{gap:14px}.hello-disc{width:72px;height:72px;flex-basis:72px}.hello-disc img{width:46px}.hello h1{font-size:22px}
  .opts{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}
</style>
</head>
<body>
<div class="app">

  <aside class="rail">
    <img class="mark" src="assets/morning-mark.svg" alt="morning" style="filter:brightness(0) invert(1)">
    <button class="rail-btn" title="מועדפים"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg></button>
    <div class="rail-sep"></div>
    <button class="rail-btn" title="הכנסות"><svg viewBox="0 0 24 24"><path d="M4 19V12m6 7V8m6 11V5m4 14H2M4 8l5-4 5 2 6-4"/></svg></button>
    <button class="rail-btn" title="ניהול שוטף"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg></button>
    <button class="rail-btn" title="הוצאות"><svg viewBox="0 0 24 24"><path d="M3 7h15a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H3zM3 7l3-4h9l3 4M16 13h5"/></svg></button>
    <button class="rail-btn" title="מכירות ולידים"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg></button>
    <button class="rail-btn" title="רשות המיסים"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M14.5 8.5c-1-1-5-.7-5 1.5 0 3 5 1 5 4 0 2-4 2.5-5 .8M12 7v10"/></svg></button>
    <button class="rail-btn" title="ניהול פיננסי"><svg viewBox="0 0 24 24"><path d="M4 18V6h16v12zM7 15l3-3 3 2 4-5"/></svg></button>
    <button class="rail-btn active" title="ניהול פרסום"><span class="dot"></span><svg viewBox="0 0 24 24"><path d="M4 14V9l12-4v13L4 14Zm0 0 2 6h4l-2-5M19 8l2-2M19 15l2 2M20 11h3"/></svg></button>
    <button class="rail-btn" title="תוספים לעסק"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM16.5 13.5v6M13.5 16.5h6"/></svg></button>
    <div class="rail-bottom">
      <div class="rail-avatar"><img src="assets/morning-mark.svg" alt=""></div>
      <button class="rail-collapse" title="כיווץ"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
    </div>
  </aside>

  <div class="surface">
    <header class="topbar">
      <div class="top-spacer"></div>
      <button class="top-icon" title="התראות"><svg viewBox="0 0 24 24"><path d="M18 15v-4a6 6 0 1 0-12 0v4l-2 3h16ZM10 21h4"/></svg></button>
      <button class="top-icon" title="מצב תצוגה"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18Z" fill="currentColor" stroke="none"/></svg></button>
      <button class="top-icon" title="עזרה"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.2 2.4c-.6.2-1 .8-1 1.4v.4M12 17h.01"/></svg></button>
      <button class="fab" title="מודעה חדשה" id="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>

    <main class="main">
      <div class="wrap">

        <section class="hello">
          <div class="hello-disc"><img src="assets/morning-logo.svg" alt="morning"></div>
          <div>
            <h1>יוצר המודעות</h1>
            <p>בוחרים, לוחצים, ומקבלים מודעה מוכנה לפרסום עם הנכסים של הלקוח</p>
            <div style="margin-top:10px" id="statusSlot"></div>
          </div>
        </section>

        <div id="notice"></div>

        <nav class="tabs">
          <button class="tab on" data-tab="create">יצירת מודעה</button>
          <button class="tab" data-tab="library">נכסי המותג <span class="count" id="cAssets">0</span></button>
          <button class="tab" data-tab="gallery">המודעות שלי <span class="count" id="cAds">0</span></button>
        </nav>

        <!-- ============ יצירה ============ -->
        <section id="tab-create">
          <div class="stepper" id="stepper"></div>
          <div class="board">
            <div class="panel" id="stepPanel"></div>
            <div class="panel">
              <h2>התוצאה</h2>
              <p class="sub">המודעה תופיע כאן, מוכנה להורדה</p>
              <div id="result">
                <div class="result-empty">
                  <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 15l4.5-4.5 3 3L16 9l4 4"/><circle cx="9" cy="8.5" r="1.3"/></svg>
                  <div>עברו על השלבים ולחצו על יצירת המודעה</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ============ נכסי מותג ============ -->
        <section id="tab-library" class="hidden">
          <div class="panel">
            <h2>נכסי המותג</h2>
            <p class="sub">לוגו, תמונות מוצר ותמונות רקע. נשמרים כאן וזמינים לכל מודעה שתיצרו</p>
            <label class="drop" id="drop">
              <input type="file" id="file" accept="image/*" multiple>
              <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 17v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1"/></svg></div>
              <b>גררו לכאן קבצים, או לחצו לבחירה</b>
              <small>PNG, JPG, WEBP או SVG. את הלוגו עדיף להעלות עם רקע שקוף</small>
            </label>
            <div id="lib"></div>
          </div>
        </section>

        <!-- ============ גלריה ============ -->
        <section id="tab-gallery" class="hidden">
          <div class="panel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
              <div><h2>המודעות שלי</h2><p class="sub" style="margin:2px 0 0">כל מה שיצרתם, שמור בדפדפן הזה</p></div>
              <button class="btn btn-ghost" id="clearGal">ניקוי הכל</button>
            </div>
            <div id="gal"></div>
          </div>
        </section>

      </div>
    </main>
  </div>
</div>
<button class="chat-fab" title="לעזרה במערכת, אני כאן"><svg viewBox="0 0 28 32"><path d="M28 32s-4.714-1.855-8.527-3.34H3.437C1.54 28.66 0 27.026 0 25.013V3.644C0 1.633 1.54 0 3.437 0h21.125c1.898 0 3.437 1.632 3.437 3.645v18.404H28V32z"/></svg></button>
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   יוצר המודעות של morning
   היצירה רצה בשרת (api/generate + api/post) מול OpenAI.
   מפתח ה-API יושב אך ורק במשתני הסביבה של השרת, לעולם לא בדף הזה.
   נכסי המותג, הלקוחות והמודעות נשמרים ב-IndexedDB של הדפדפן הזה בלבד.
   =================================================================== */

const API_BASE = /github\.io$/.test(location.hostname) ? 'https://REPLACE_WITH_VERCEL_URL' : '';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const LIVE = { on:false, info:null };

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3200)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function attr(s){return esc(s).replace(/"/g,'&quot;')}

let _ac;
function accessCode(){
  if(_ac!==undefined)return _ac;
  let c='';
  try{c=localStorage.getItem('morning_ac')||'';if(!c&&API_BASE){c=prompt('הזינו קוד גישה ליצירה (נשמר במחשב זה בלבד):')||'';if(c)localStorage.setItem('morning_ac',c)}}catch(e){}
  _ac=c;return _ac;
}
const headers = () => ({'Content-Type':'application/json','x-access-code':accessCode()});

/* =================== אחסון מקומי (IndexedDB) =================== */
const DB = {
  _p:null,
  open(){
    if(this._p)return this._p;
    this._p=new Promise((res,rej)=>{
      const r=indexedDB.open('morning_ads',1);
      r.onupgradeneeded=()=>{const d=r.result;['assets','clients','ads'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
    return this._p;
  },
  async all(s){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(s).objectStore(s).getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>rej(t.error)})},
  async put(s,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(s,'readwrite').objectStore(s).put(v);t.onsuccess=()=>res(v);t.onerror=()=>rej(t.error)})},
  async del(s,id){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(s,'readwrite').objectStore(s).delete(id);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})},
  async clear(s){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(s,'readwrite').objectStore(s).clear();t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
};

let ASSETS=[], ADS=[], CLIENTS=[];

/* =================== בדיקת חיבור =================== */
fetch(API_BASE+'/api/health',{cache:'no-store'})
  .then(r=>r.ok?r.json():null)
  .then(j=>{
    if(!j) return offline('לא הצלחנו להגיע לשרת היצירה');
    if(!j.openai) return offline('השרת עונה אבל אין מפתח OpenAI מוגדר');
    LIVE.on=true;LIVE.info=j;
    $('#statusSlot').innerHTML='<span class="live-badge"><i></i>מחובר ליצירה אמיתית</span>';
  })
  .catch(()=>offline('לא הצלחנו להגיע לשרת היצירה'));

function offline(why){
  LIVE.on=false;
  $('#notice').innerHTML='<div class="notice warn"><b>מצב לא מחובר.</b> '+esc(why)+
    '. אפשר לעבור על כל השלבים ולנהל נכסים, אבל היצירה עצמה דורשת שרת עם מפתח OpenAI פעיל. הפרטים ב-DEPLOY.md שבמאגר</div>';
}

/* =================== האפשרויות =================== */
const PROMOTE = [
  {v:'מבצע או הנחה', d:'הטבה לזמן מוגבל', ic:'M9 15 15 9M9.5 9.5h.01M14.5 14.5h.01M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z'},
  {v:'מוצר חדש', d:'השקה של משהו חדש', ic:'m12 3 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.2l5.9-.9Z'},
  {v:'שירות', d:'שירות מקצועי שנותנים', ic:'M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8ZM4 21c1-5 15-5 16 0'},
  {v:'אירוע', d:'סדנה, כנס או ערב לקוחות', ic:'M7 3v3M17 3v3M4 9h16M5 6h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z'},
  {v:'פתיחת עסק', d:'הכרזה על פתיחה או סניף', ic:'M4 10h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9ZM3 10l2-5h14l2 5M12 10v11'},
  {v:'גיוס לקוחות', d:'הגדלת פניות ולידים', ic:'M12 21s-7-4.3-7-9.5A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 7 3.5C19 16.7 12 21 12 21Z'},
  {v:'תוכן מיתוגי', d:'חשיפה ובניית מותג', ic:'M4 7h16M4 12h10M4 17h7M17 14l4 4-4 4'},
  {v:'גיוס עובדים', d:'דרושים לצוות', ic:'M16 21v-2a4 4 0 0 0-8 0v2M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8ZM19 8v6M22 11h-6'}
];
const KIND = [
  {v:'תמונה', d:'מודעת תמונה סטטית', ic:'M4 5h16v14H4zM4 15l4.5-4.5 3 3L16 9l4 4'},
  {v:'אנימציה', d:'תנועה עדינה, מוכן לסטורי', ic:'m10 8 6 4-6 4V8ZM5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z'}
];
const FORMAT = [
  {v:'1:1', t:'ריבוע', d:'פוסט בפיד'},
  {v:'9:16', t:'אנכי', d:'סטורי וריל'},
  {v:'16:9', t:'רוחב', d:'באנר ויוטיוב'}
];
const STYLE = [
  {v:'צילום אותנטי', d:'נראה אמיתי, לא סטוק', g:'linear-gradient(135deg,#C9A27E,#8E6B4F)'},
  {v:'סטודיו נקי', d:'רקע חלק, מוצר במרכז', g:'linear-gradient(135deg,#F2F4F5,#CFD8D9)'},
  {v:'לייפסטייל חם', d:'אנשים, אור טבעי', g:'linear-gradient(135deg,#F6C79B,#E2856B)'},
  {v:'מינימליסטי גרפי', d:'צורות ושטחי צבע', g:'linear-gradient(135deg,var(--ink),#0DAC81)'},
  {v:'מודגש וצבעוני', d:'ניגודיות גבוהה', g:'linear-gradient(135deg,#F5515F,#9F2BE0)'},
  {v:'איור', d:'מצויר, חם ואישי', g:'linear-gradient(135deg,#8FD3F4,#84FAB0)'}
];
const AUDIENCE = ['קהל רחב','נשים 25-40','נשים 40-60','גברים 25-45','הורים צעירים','בעלי עסקים','דור צעיר 18-28','גיל הזהב','תושבי האזור'];
const TONE = ['ידידותי וחם','מקצועי ומהוקצע','אנרגטי ומניע','יוקרתי ורגוע','שובב וקליל'];

/* =================== המצב =================== */
const S = {
  step:0, client:null, promote:'', promoteFree:'', kind:'תמונה', format:'1:1',
  style:'', audience:'', tone:'', cta:'', extra:'', assets:[], prompt:'', promptTouched:false
};
const STEPS = [
  {k:'client',  t:'הלקוח',      need:()=>!!(S.client&&S.client.name)},
  {k:'promote', t:'מה מקדמים',  need:()=>!!S.promote},
  {k:'kind',    t:'סוג המודעה', need:()=>!!S.kind},
  {k:'format',  t:'פורמט',      need:()=>!!S.format},
  {k:'style',   t:'סגנון',      need:()=>!!S.style},
  {k:'aud',     t:'קהל וטון',   need:()=>!!(S.audience&&S.tone)},
  {k:'assets',  t:'נכסי מותג',  need:()=>true},
  {k:'go',      t:'יצירה',      need:()=>true}
];

const DRAFT='morning_ads_draft';
function saveDraft(){
  try{
    const {step,client,promote,promoteFree,kind,format,style,audience,tone,cta,extra,assets,prompt,promptTouched}=S;
    localStorage.setItem(DRAFT,JSON.stringify({step,client,promote,promoteFree,kind,format,style,audience,tone,cta,extra,assets,prompt,promptTouched}));
  }catch(e){}
}
function loadDraft(){
  try{
    const d=JSON.parse(localStorage.getItem(DRAFT)||'null');
    if(d&&typeof d==='object')Object.assign(S,d);
  }catch(e){}
}
function reachable(i){for(let x=0;x<i;x++)if(!STEPS[x].need())return false;return true}
function goStep(i){
  if(i<0||i>=STEPS.length)return;
  if(!reachable(i)){toast('צריך להשלים את השלבים הקודמים');return}
  S.step=i; saveDraft(); renderStepper(); renderStep();
}
function next(){
  if(!STEPS[S.step].need()){toast('בחרו אפשרות כדי להמשיך');return}
  goStep(Math.min(S.step+1,STEPS.length-1));
}

function renderStepper(){
  $('#stepper').innerHTML = STEPS.map((st,i)=>{
    const done = st.need() && i<S.step;
    const cls = i===S.step?'now':(done?'done':'');
    return `<button class="${cls}" data-go="${i}" ${reachable(i)?'':'disabled'}><i>${done?'✓':(i+1)}</i>${esc(st.t)}</button>`
      + (i<STEPS.length-1?'<span class="arrow">‹</span>':'');
  }).join('');
  $$('#stepper [data-go]').forEach(b=>b.onclick=()=>goStep(+b.dataset.go));
}

/* =================== מסכי השלבים =================== */
function optCard(o,cur){
  return `<button class="opt ${cur===o.v?'on':''}" data-pick="${attr(o.v)}">
    ${o.ic?`<span class="ic"><svg viewBox="0 0 24 24"><path d="${o.ic}"/></svg></span>`:''}
    ${o.g?`<span class="swatch" style="background:${o.g}"></span>`:''}
    <b>${esc(o.t||o.v)}</b>${o.d?`<small>${esc(o.d)}</small>`:''}</button>`;
}

function renderStep(){
  const k=STEPS[S.step].k;
  const head=(t,s)=>`<div class="step-title"><h2>${t}</h2><small>שלב ${S.step+1} מתוך ${STEPS.length}</small></div><p class="sub">${s}</p>`;
  let html='';

  if(k==='client'){
    html = head('בשביל מי המודעה','בחרו לקוח שמור או הוסיפו חדש. הפרטים יישמרו לפעם הבאה')
      + `<div class="opts wide">
          ${CLIENTS.map(c=>`<button class="opt ${S.client&&S.client.id===c.id?'on':''}" data-client="${attr(c.id)}">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/></svg></span>
            <b>${esc(c.name)}</b><small>${esc(c.field||'')}${c.city?' · '+esc(c.city):''}</small></button>`).join('')}
          <button class="opt" data-newclient="1"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><b>לקוח חדש</b><small>הוספת עסק</small></button>
        </div>
        <div id="clientForm" class="${S.client&&S.client._new?'':'hidden'}" style="margin-top:18px">
          <div class="two">
            <label class="field"><span>שם העסק</span><input id="c_name" value="${attr(S.client&&S.client.name)}" placeholder="סטודיו מוב"></label>
            <label class="field"><span>תחום</span><input id="c_field" value="${attr(S.client&&S.client.field)}" placeholder="סטודיו לפילאטיס"></label>
          </div>
          <label class="field"><span>עיר</span><input id="c_city" value="${attr(S.client&&S.client.city)}" placeholder="תל אביב"></label>
          <button class="btn btn-primary btn-sm" id="saveClient">שמירה והמשך</button>
        </div>`;
  }

  if(k==='promote'){
    html = head('מה מקדמים','לחיצה על אפשרות ממשיכה אתכם לשלב הבא')
      + `<div class="opts">${PROMOTE.map(o=>optCard(o,S.promote)).join('')}</div>
         <label class="field" style="margin-top:18px"><span>רוצים לדייק? (לא חובה)</span>
           <input id="promoteFree" value="${attr(S.promoteFree)}" placeholder="לדוגמה: שיעור היכרות ראשון ללא עלות"></label>`;
  }

  if(k==='kind'){
    html = head('סוג המודעה','תמונה סטטית או מודעה עם תנועה')
      + `<div class="opts wide">${KIND.map(o=>optCard(o,S.kind)).join('')}</div>`
      + (S.kind==='אנימציה'
        ? `<div class="notice info" style="margin-top:18px">האנימציה נבנית מהתמונה שנוצרת: תנועת מצלמה איטית עם חשיפה רכה, ומתקבל קובץ וידאו מוכן לסטורי. בלי עלות יצירה נוספת</div>`
        : '');
  }

  if(k==='format'){
    html = head('פורמט','לאן המודעה הולכת')
      + `<div class="opts wide">${FORMAT.map(o=>optCard(o,S.format)).join('')}</div>`;
  }

  if(k==='style'){
    html = head('סגנון ויזואלי','איך המודעה תיראה')
      + `<div class="opts">${STYLE.map(o=>optCard(o,S.style)).join('')}</div>`;
  }

  if(k==='aud'){
    html = head('קהל יעד וטון','למי מדברים, ואיך')
      + `<div class="grouplabel">קהל היעד</div>
         <div class="chips">${AUDIENCE.map(a=>`<button class="chip ${S.audience===a?'on':''}" data-aud="${attr(a)}">${esc(a)}</button>`).join('')}</div>
         <div class="grouplabel">הטון</div>
         <div class="chips">${TONE.map(t=>`<button class="chip ${S.tone===t?'on':''}" data-tone="${attr(t)}">${esc(t)}</button>`).join('')}</div>
         <label class="field" style="margin-top:20px"><span>קריאה לפעולה</span>
           <input id="ctaIn" value="${attr(S.cta)}" placeholder="קבעו שיעור היכרות"></label>`;
  }

  if(k==='assets'){
    html = head('נכסי המותג','בחרו מה לשלב במודעה. הנכסים נשלחים למנוע כתמונות ייחוס')
      + (ASSETS.length
        ? `<div class="asset-grid">${ASSETS.map(a=>`
            <div class="asset ${S.assets.includes(a.id)?'on':''}" data-asset="${attr(a.id)}">
              <span class="tick">✓</span>
              <div class="thumb"><img src="${a.url}" alt=""></div>
              <div class="cap"><b>${esc(a.name)}</b><span>${esc(a.tag)}</span></div>
            </div>`).join('')}</div>`
        : `<div class="empty-lib">עדיין אין נכסים שמורים.<br>אפשר להעלות לוגו ותמונות בלשונית נכסי המותג, או פשוט לדלג</div>`)
      + `<button class="btn btn-ghost" data-tabjump="library" style="margin-top:12px">לניהול נכסי המותג</button>`;
  }

  if(k==='go'){
    syncPrompt();
    html = head('סיכום ויצירה','לחיצה על צ׳יפ מחזירה לשלב שלו')
      + `<div class="sum">
          ${sumChip(0,'לקוח',S.client&&S.client.name)}
          ${sumChip(1,'מקדמים',S.promote+(S.promoteFree?' · '+S.promoteFree:''))}
          ${sumChip(2,'סוג',S.kind)}
          ${sumChip(3,'פורמט',S.format)}
          ${sumChip(4,'סגנון',S.style)}
          ${sumChip(5,'קהל',S.audience+(S.tone?' · '+S.tone:''))}
          ${sumChip(6,'נכסים',S.assets.length?S.assets.length+' נבחרו':'ללא')}
         </div>
         <label class="field"><span>הנחיות נוספות (לא חובה)</span>
           <textarea id="extraIn" rows="2" placeholder="לדוגמה: אור בוקר רך, בלי אנשים בפריים">${esc(S.extra)}</textarea></label>
         <div style="display:flex;justify-content:space-between;align-items:center">
           <span style="font-size:14px;color:var(--muted);font-weight:500">הפרומפט שיישלח למנוע</span>
           <button class="btn btn-ghost" id="resetPrompt">איפוס אוטומטי</button>
         </div>
         <label class="field"><textarea id="promptIn" rows="6">${esc(S.prompt)}</textarea></label>
         <button class="btn btn-primary" id="go">${S.kind==='אנימציה'?'יצירת המודעה המונפשת':'יצירת המודעה'}</button>`;
  }

  $('#stepPanel').innerHTML = `<div class="stepbody">${html}
    <div class="step-foot">
      ${S.step>0?'<button class="btn btn-outline btn-sm" id="back">חזרה</button>':''}
      <div class="spacer"></div>
      ${k!=='go'?`<button class="btn btn-primary btn-sm" id="nextBtn">${STEPS[S.step].need()?'המשך':'דילוג'}</button>`:''}
    </div></div>`;
  bindStep(k);
}

function sumChip(i,label,val){
  return `<button data-go="${i}"><em>${esc(label)}</em>${esc(val||'לא נבחר')}</button>`;
}

function bindStep(k){
  const b=$('#back'); if(b)b.onclick=()=>goStep(S.step-1);
  const n=$('#nextBtn'); if(n)n.onclick=next;
  $$('#stepPanel [data-go]').forEach(el=>el.onclick=()=>goStep(+el.dataset.go));
  $$('#stepPanel [data-tabjump]').forEach(el=>el.onclick=()=>showTab(el.dataset.tabjump));

  /* בחירה בקלף מסמנת ומעבירה מיד לשלב הבא */
  $$('#stepPanel [data-pick]').forEach(el=>el.onclick=()=>{
    const v=el.dataset.pick;
    S.promptTouched=false;
    if(k==='kind'){ S.kind=v; renderStepper(); renderStep(); setTimeout(next,500); return }
    if(k==='promote')S.promote=v;
    if(k==='format')S.format=v;
    if(k==='style')S.style=v;
    $$('#stepPanel [data-pick]').forEach(x=>x.classList.toggle('on',x===el));
    renderStepper(); setTimeout(next,200);
  });

  if(k==='client'){
    $$('#stepPanel [data-client]').forEach(el=>el.onclick=()=>{
      S.client=CLIENTS.find(c=>c.id===el.dataset.client)||null;
      S.promptTouched=false; renderStepper(); setTimeout(next,200);
    });
    const nc=$('#stepPanel [data-newclient]');
    if(nc)nc.onclick=()=>{S.client={id:'c'+Date.now(),name:'',field:'',city:'',_new:true};renderStep();const f=$('#c_name');if(f)f.focus()};
    const sc=$('#saveClient');
    if(sc)sc.onclick=async()=>{
      const name=$('#c_name').value.trim();
      if(!name){toast('צריך שם עסק');$('#c_name').focus();return}
      const rec={id:S.client.id,name,field:$('#c_field').value.trim(),city:$('#c_city').value.trim()};
      await DB.put('clients',rec); CLIENTS=await DB.all('clients'); S.client=rec; S.promptTouched=false;
      toast('הלקוח נשמר'); renderStepper(); next();
    };
  }

  if(k==='promote'){const f=$('#promoteFree');if(f)f.oninput=()=>{S.promoteFree=f.value.trim();S.promptTouched=false;saveDraft()}}

  if(k==='aud'){
    $$('#stepPanel [data-aud]').forEach(el=>el.onclick=()=>{
      S.audience=el.dataset.aud; S.promptTouched=false;
      $$('#stepPanel [data-aud]').forEach(x=>x.classList.toggle('on',x===el));
      renderStepper(); if(S.tone)setTimeout(next,240);
    });
    $$('#stepPanel [data-tone]').forEach(el=>el.onclick=()=>{
      S.tone=el.dataset.tone; S.promptTouched=false;
      $$('#stepPanel [data-tone]').forEach(x=>x.classList.toggle('on',x===el));
      renderStepper(); if(S.audience)setTimeout(next,240);
    });
    const c=$('#ctaIn'); if(c)c.oninput=()=>{S.cta=c.value.trim();saveDraft()};
  }

  if(k==='assets'){
    $$('#stepPanel [data-asset]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.asset;
      S.assets = S.assets.includes(id) ? S.assets.filter(x=>x!==id) : S.assets.concat(id);
      S.promptTouched=false; el.classList.toggle('on'); saveDraft();
    });
  }

  if(k==='go'){
    const e=$('#extraIn'); if(e)e.oninput=()=>{S.extra=e.value;S.promptTouched=false;syncPrompt();$('#promptIn').value=S.prompt;saveDraft()};
    const pi=$('#promptIn'); if(pi)pi.oninput=()=>{S.prompt=pi.value;S.promptTouched=true;saveDraft()};
    $('#resetPrompt').onclick=()=>{S.promptTouched=false;syncPrompt();$('#promptIn').value=S.prompt;toast('הפרומפט אופס')};
    $('#go').onclick=generate;
  }
}

function syncPrompt(){
  if(S.promptTouched)return;
  const c=S.client||{}, p=[];
  p.push(`מודעה חזותית לפרסום ברשתות החברתיות עבור ${c.name||'העסק'}${c.field?', '+c.field:''}${c.city?', '+c.city:''}.`);
  if(S.promote)p.push(`מה שמקדמים: ${S.promote}${S.promoteFree?' · '+S.promoteFree:''}.`);
  if(S.audience)p.push(`קהל היעד: ${S.audience}.`);
  if(S.tone)p.push(`טון: ${S.tone}.`);
  if(S.style)p.push(`סגנון חזותי: ${S.style}.`);
  const chosen=ASSETS.filter(a=>S.assets.includes(a.id));
  if(chosen.some(a=>a.tag==='לוגו'))p.push('שלב את הלוגו המצורף בתמונה, נקי וקריא, בפינה אחת, בלי לעוות אותו ובלי לשנות את צבעיו.');
  if(chosen.some(a=>a.tag!=='לוגו'))p.push('השתמש בתמונות הייחוס המצורפות כמקור לנראות של המוצר או המקום, ושמור על נאמנות להן.');
  p.push('הרכב מקצועי ונקי, תאורה טבעית ומחמיאה, מראה של קמפיין אמיתי ולא של תמונת סטוק. השאר שטח שקט בפריים למיקום טקסט.');
  if(S.kind==='אנימציה')p.push('הפריים ישמש בסיס לאנימציה, לכן שמור על מרכז יציב ועל שוליים נדיבים.');
  if(S.extra&&S.extra.trim())p.push(S.extra.trim());
  S.prompt=p.join(' ');
}

let busy=false;
async function generate(){
  if(busy)return;
  if(!LIVE.on){toast('אין חיבור לשרת היצירה');return}
  if(!S.client||!S.client.name){toast('חסר לקוח');goStep(0);return}
  busy=true; const btn=$('#go'); if(btn)btn.disabled=true;
  const t0=Date.now();
  $('#result').innerHTML='<div class="loading"><div class="spinner"></div><b>מייצרים את המודעה</b>'+
    '<div>כותבים את הקופי ומרכיבים את הקריאייטיב</div><div class="clock" id="clock">0:00</div></div>';
  const tick=setInterval(()=>{const el=$('#clock');if(!el)return clearInterval(tick);
    const s=Math.floor((Date.now()-t0)/1000);el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);

  const refs=ASSETS.filter(a=>S.assets.includes(a.id)).map(a=>a.url);
  const copyP=fetch(API_BASE+'/api/post',{method:'POST',headers:headers(),body:JSON.stringify(copyBrief())})
    .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('שגיאה '+r.status));return j})
    .catch(e=>({_err:e.message||String(e)}));
  const imgP=fetch(API_BASE+'/api/generate',{method:'POST',headers:headers(),
      body:JSON.stringify({kind:'image',engine:'openai',prompt:S.prompt,format:S.format,images:refs})})
    .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('שגיאה '+r.status));return j})
    .catch(e=>({_err:e.message||String(e)}));

  const [copy,img]=await Promise.all([copyP,imgP]);
  clearInterval(tick); busy=false;

  if(img._err&&copy._err){
    $('#result').innerHTML='<div class="notice err"><b>היצירה נכשלה.</b> '+esc(img._err)+'</div>';
    renderStep(); return;
  }
  let video=null;
  if(img.url&&S.kind==='אנימציה'){
    $('#result').innerHTML='<div class="loading"><div class="spinner"></div><b>מנפישים את המודעה</b><div>בונים תנועת מצלמה על הפריים</div></div>';
    try{ video=await animate(img.url,S.format) }catch(e){ toast('ההנפשה נכשלה, מוצגת התמונה') }
  }
  showResult(img,copy,video);
  renderStep();
}

    ? `<video src="${video.url}" controls autoplay muted loop playsinline></video>`

  $('#result').innerHTML=`
    <div class="stage">${media||'<div style="color:var(--muted)">לא נוצרה תמונה</div>'}</div>
    <label class="field" style="margin-top:16px"><span>הקופי למודעה</span><textarea id="resText" rows="6">${esc(text)}</textarea></label>
    ${copy&&copy._err?'<div class="notice err">כתיבת הקופי נכשלה: '+esc(copy._err)+'</div>':''}
    ${img&&img._err?'<div class="notice err">יצירת התמונה נכשלה: '+esc(img._err)+'</div>':''}
    ${img&&img.url?`<div class="meta">נוצר עכשיו · ${esc(img.model||'')}${img.took!=null?' · '+img.took+' שניות':''}${img.refs?' · '+img.refs+' נכסי מותג שולבו':''}${video?' · אנימציה '+video.seconds+' שניות':''}</div>`:''}
    <div class="result-actions">
      ${img&&img.url?`<a class="btn btn-primary btn-sm" href="${img.url}" download="morning-ad.webp">הורדת התמונה</a>`:''}
      ${video?`<a class="btn btn-primary btn-sm" href="${video.url}" download="morning-ad.${video.ext}">הורדת האנימציה</a>`:''}
      <button class="btn btn-outline btn-sm" id="copyText">העתקת הקופי</button>
      <button class="btn btn-outline btn-sm" id="again">מודעה נוספת</button>
    </div>`;
  const ri=$('#resImg'); if(ri){ri.style.cursor='zoom-in';ri.onclick=()=>lightbox(img.url,false)}

/* =================== אנימציה: תנועת מצלמה על הפריים =================== */
function animate(url,format,seconds){
  seconds=seconds||6;
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onerror=()=>reject(new Error('טעינת התמונה נכשלה'));
    img.onload=()=>{
      const [W,H]=({'1:1':[1080,1080],'9:16':[1080,1920],'16:9':[1920,1080]})[format]||[1080,1080];
      const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      const ctx=cv.getContext('2d');
      if(!cv.captureStream||!window.MediaRecorder)return reject(new Error('הדפדפן לא תומך בהקלטה'));
      const mime=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']
        .find(m=>MediaRecorder.isTypeSupported(m));
      if(!mime)return reject(new Error('אין קודק וידאו זמין'));
      const rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:6e6});
      const chunks=[];
      rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      rec.onerror=()=>reject(new Error('ההקלטה נכשלה'));
      rec.onstop=()=>{
        const type=mime.split(';')[0];
        const blob=new Blob(chunks,{type});
        resolve({url:URL.createObjectURL(blob),blob,seconds,ext:type==='video/mp4'?'mp4':'webm'});
      };
      rec.start();
      const t0=performance.now();
      let done=false;
      const finish=()=>{ if(done)return; done=true; try{rec.stop()}catch(e){} };
      /* רשת ביטחון: אם משהו נתקע, עוצרים בכל מקרה ולא משאירים הבטחה תלויה */
      const guard=setTimeout(finish,seconds*1000+10000);
      const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;   /* פנימה והחוצה, בלי קפיצות */
      /* משתמשים ב-setTimeout ולא ב-requestAnimationFrame: בלשונית מוסתרת rAF נעצר,
         וההנפשה הייתה נתקעת לנצח. ההתקדמות נגזרת מהשעון, כך שהאורך תמיד נכון. */
      (function frame(){
        const t=Math.min(1,(performance.now()-t0)/(seconds*1000));
        const e=ease(t);
        const zoom=1.05+0.10*e;                 /* זום איטי פנימה */
        const panY=(e-0.5)*0.03;                /* תזוזה אנכית עדינה */
        const sc=Math.max(W/img.width,H/img.height)*zoom;
        const dw=img.width*sc, dh=img.height*sc;
        ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
        ctx.drawImage(img,(W-dw)/2,(H-dh)/2+panY*H,dw,dh);
        const fade = t<0.12 ? 1-t/0.12 : (t>0.9 ? (t-0.9)/0.1 : 0);   /* חשיפה בפתיחה, דהייה בסוף */
        if(fade>0){ctx.fillStyle='rgba(0,0,0,'+fade+')';ctx.fillRect(0,0,W,H)}
        if(t<1)setTimeout(frame,33); else setTimeout(()=>{clearTimeout(guard);finish()},150);
      })();
    };
    img.src=url;
  });
}

function lightbox(url,isVideo){
  const d=document.createElement('div');
  d.className='lightbox';
  d.innerHTML=isVideo?`<video src="${url}" controls autoplay loop muted></video>`:`<img src="${url}" alt="">`;
  d.onclick=()=>d.remove(); document.body.appendChild(d);
}

/* =================== נכסי מותג =================== */
const TAGS=['לוגו','מוצר','רקע','אחר'];

function shrink(file,max){
  max=max||1280;
  /* כל קובץ עובר רסטור לקנבס ויוצא כ-WebP: זה מקטין, מאחד פורמט,
     ושומר שקיפות. חשוב במיוחד ל-SVG, שמנוע התמונות של OpenAI לא מקבל. */
  const raster=src=>new Promise((res,rej)=>{
    const im=new Image();
    im.onerror=()=>rej(new Error('הקובץ אינו תמונה תקינה'));
    im.onload=()=>{
      const w=im.naturalWidth||im.width||max, h=im.naturalHeight||im.height||max;
      const sc=Math.min(1,max/Math.max(w,h));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(w*sc)); c.height=Math.max(1,Math.round(h*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/webp',0.92));
    };
    im.src=src;
  });
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('קריאת הקובץ נכשלה'));
    if(file.type==='image/svg+xml'){
      fr.onload=()=>{
        /* ל-SVG בלי מידות מפורשות הדפדפן לא יודע לצייר לקנבס, לכן משלימים מה-viewBox */
        let t=String(fr.result);
        if(!/<svg[^>]*\swidth=/.test(t)){
          const vb=/viewBox="([\d.\s-]+)"/.exec(t);
          const box=vb?vb[1].trim().split(/\s+/):null;
          const w=box?Math.round(parseFloat(box[2]))||512:512;
          const h=box?Math.round(parseFloat(box[3]))||512:512;
          const k=max/Math.max(w,h);
          t=t.replace('<svg','<svg width="'+Math.round(w*k)+'" height="'+Math.round(h*k)+'"');
        }
        raster('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t)).then(res,rej);
      };
      fr.readAsText(file);
    }else{
      fr.onload=()=>raster(fr.result).then(res,rej);
      fr.readAsDataURL(file);
    }
  });
}

async function addFiles(files){
  let added=0;
  for(const f of Array.from(files||[])){
    if(!/^image\//.test(f.type)){toast('אפשר להעלות תמונות בלבד');continue}
    if(f.size>15e6){toast('הקובץ '+f.name+' גדול מדי');continue}
    try{
      const url=await shrink(f);
      const tag=/logo|לוגו/i.test(f.name)?'לוגו':'מוצר';
      await DB.put('assets',{id:'a'+Date.now()+Math.random().toString(36).slice(2,6),
        name:f.name.replace(/\.[^.]+$/,'').slice(0,28),tag,url,date:new Date().toLocaleString('he-IL')});
      added++;
    }catch(e){toast('לא הצלחנו לקרוא את '+f.name)}
  }
  if(added){ASSETS=await DB.all('assets');renderLib();renderCounts();toast(added===1?'נכס נוסף':added+' נכסים נוספו')}
}

  $('#lib').innerHTML='<div class="asset-grid">'+ASSETS.map(a=>`
    <div class="asset">
      <button class="del" data-del="${attr(a.id)}" title="מחיקה">×</button>
      <div class="thumb"><img src="${a.url}" alt=""></div>
      <div class="cap"><b>${esc(a.name)}</b></div>
      <div class="tagrow">${TAGS.map(t=>`<button class="${a.tag===t?'on':''}" data-tag="${attr(a.id)}|${attr(t)}">${esc(t)}</button>`).join('')}</div>
    </div>`).join('')+'</div>';
  $$('#lib [data-del]').forEach(b=>b.onclick=async ev=>{
    ev.stopPropagation();
    await DB.del('assets',b.dataset.del);
    S.assets=S.assets.filter(x=>x!==b.dataset.del);

  $$('#lib [data-tag]').forEach(b=>b.onclick=async()=>{

}

/* =================== התחלה =================== */
(async()=>{
  try{ const r=await Promise.all([DB.all('assets'),DB.all('ads'),DB.all('clients')]); ASSETS=r[0];ADS=r[1];CLIENTS=r[2]; }
  catch(e){ toast('האחסון המקומי לא זמין בדפדפן הזה') }
  loadDraft();
  /* אם נכס שנבחר נמחק בינתיים, מסירים אותו מהטיוטה */
  S.assets=(S.assets||[]).filter(id=>ASSETS.some(a=>a.id===id));
  while(S.step>0&&!reachable(S.step))S.step--;
  renderCounts(); renderLib(); renderGallery(); renderStepper(); renderStep();
})();
</script>
